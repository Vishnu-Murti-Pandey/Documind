services:

  # =================================================
  # PostgreSQL
  #
  # No public host port.
  # Only containers connected to rag-network-prod
  # can access PostgreSQL on postgres:5432.
  # =================================================

  postgres:
    image: postgres:17-alpine
    container_name: rag-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - rag-network-prod


  # =================================================
  # MinIO
  #
  # No public MinIO console in production.
  # The backend accesses it through minio:9000.
  # =================================================

  minio:
    build:
      context: ./docker/minio

    container_name: rag-minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - rag-network-prod


  # =================================================
  # Qdrant
  #
  # Not exposed publicly.
  # Backend connects through qdrant:6333.
  # =================================================

  qdrant:
    build:
      context: ./docker/qdrant

    container_name: rag-qdrant

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:6333/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - rag-network-prod


# =================================================
# Persistent Volumes
# =================================================

volumes:
  postgres_data:
    name: rag-postgres-data

  minio_data:
    name: rag-minio-data

  qdrant_data:
    name: rag-qdrant-data


# =================================================
# Application Network
# =================================================

networks:
  rag-network-prod:
    name: rag-network-prod
    driver: bridge